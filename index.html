<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHRONODECK: La Venganza del Azimut (1986)</title>
<style>
  :root {
    --zx-black: #000000;
    --zx-blue: #0000D7;
    --zx-red: #D70000;
    --zx-magenta: #D700D7;
    --zx-green: #00D700;
    --zx-cyan: #00D7D7;
    --zx-yellow: #D7D700;
    --zx-white: #D7D7D7;
    --zx-b-blue: #0000FF;
    --zx-b-red: #FF0000;
    --zx-b-magenta: #FF00FF;
    --zx-b-green: #00FF00;
    --zx-b-cyan: #00FFFF;
    --zx-b-yellow: #FFFF00;
    --zx-b-white: #FFFFFF;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: #111;
    color: var(--zx-white);
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #cabinet {
    position: relative;
    padding: 24px;
    background-color: var(--zx-black);
    border: 8px solid #333;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #screen-container {
    position: relative;
    width: 768px;
    height: 576px;
    max-width: 92vw;
    max-height: 69vw;
    background-color: var(--zx-black);
    overflow: hidden;
    border: 2px solid #222;
  }

  canvas {
    width: 100%;
    height: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }

  /* Efecto CRT y Scanlines */
  .crt-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      rgba(18, 16, 16, 0) 50%, 
      rgba(0, 0, 0, 0.35) 50%
    ), linear-gradient(
      90deg,
      rgba(255, 0, 0, 0.03),
      rgba(0, 255, 0, 0.01),
      rgba(0, 0, 255, 0.03)
    );
    background-size: 100% 4px, 6px 100%;
    pointer-events: none;
    z-index: 10;
  }

  #ui-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: bold;
    color: var(--zx-b-cyan);
    text-transform: uppercase;
    flex-wrap: wrap;
    gap: 6px;
  }

  .ui-group {
    display: flex;
    gap: 6px;
  }

  .btn-retro {
    background: var(--zx-black);
    color: var(--zx-b-yellow);
    border: 2px solid var(--zx-b-yellow);
    padding: 4px 8px;
    font-family: inherit;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .btn-retro:hover {
    background: var(--zx-b-yellow);
    color: var(--zx-black);
  }

  .btn-retro:active {
    transform: translateY(1px);
  }

  /* Controles Táctiles / Móviles */
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 768px;
    margin-top: 12px;
    justify-content: space-between;
    padding: 0 10px;
    gap: 10px;
  }

  @media (max-width: 850px), (pointer: coarse) {
    #touch-controls {
      display: flex;
    }
    #cabinet {
      padding: 10px;
      border-width: 4px;
    }
  }

  .d-pad {
    display: flex;
    gap: 12px;
  }

  .touch-btn {
    background: #222;
    color: var(--zx-b-white);
    border: 2px solid var(--zx-white);
    border-radius: 6px;
    width: 64px;
    height: 52px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }

  .touch-btn:active {
    background: var(--zx-b-magenta);
    border-color: var(--zx-b-yellow);
  }

  .touch-action {
    width: 110px;
    background: var(--zx-red);
    border-color: var(--zx-b-red);
  }
</style>
</head>
<body>

<div id="cabinet">
  <div id="ui-bar">
    <span>SINCLAIR ZX RESEARCH // BNE-TFM-86</span>
    <div class="ui-group">
      <button id="btn-crt" class="btn-retro">CRT: ON</button>
      <button id="btn-music" class="btn-retro">MÚSICA: ON</button>
      <button id="btn-sound" class="btn-retro">FX: ON</button>
    </div>
  </div>

  <div id="screen-container">
    <!-- Resolución interna 320x240 (256x192 área útil + 32px borde ULA) -->
    <canvas id="zx-canvas" width="320" height="240"></canvas>
    <div id="crt-layer" class="crt-overlay"></div>
  </div>

  <div id="touch-controls">
    <div class="d-pad">
      <div class="touch-btn" id="t-left">&lt;</div>
      <div class="touch-btn" id="t-right">&gt;</div>
    </div>
    <div class="touch-btn touch-action" id="t-action">ACCIÓN / Z</div>
  </div>
</div>

<script>
/**
 * ============================================================================
 * CHRONODECK: LA VENGANZA DEL AZIMUT
 * Motor Retro ZX Spectrum 48K / 128K +2A en Vanilla JS Canvas y Web Audio API
 * ============================================================================
 */

// --- PALETA OFICIAL SINCLAIR ZX SPECTRUM ---
const PAL = {
  BLACK:    '#000000',
  BLUE:     '#0000D7',
  RED:      '#D70000',
  MAGENTA:  '#D700D7',
  GREEN:    '#00D700',
  CYAN:     '#00D7D7',
  YELLOW:   '#D7D700',
  WHITE:    '#D7D7D7',
  B_BLACK:  '#000000',
  B_BLUE:   '#0000FF',
  B_RED:    '#FF0000',
  B_MAGENTA:'#FF00FF',
  B_GREEN:  '#00FF00',
  B_CYAN:   '#00FFFF',
  B_YELLOW: '#FFFF00',
  B_WHITE:  '#FFFFFF'
};

// --- DIMENSIONES DE PANTALLA Y ÁREA ACTIVA (256x192) ---
const FULL_W = 320;
const FULL_H = 240;
const OFF_X  = 32;
const OFF_Y  = 24;
const SCR_W  = 256;
const SCR_H  = 192;

const canvas = document.getElementById('zx-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

// --- SISTEMA DE AUDIO Y MELODÍA 8-BIT (WEB AUDIO API) ---
const NOTE = {
  _: 0,
  A2: 110.00, Bb2: 116.54, C3: 130.81, Cs3: 138.59, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, Bb3: 233.08,
  D4: 293.66, A4: 440.00, C5: 523.25, Cs5: 554.37, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, Bb5: 932.33
};

const CHRONODECK_THEME = [
  // --- PARTE A (Dm -> A7 -> Gm -> A7) ---
  ['D5', 'D3', 2], ['_', 'D4', 1], ['A4', 'D3', 1],
  ['D5', 'D3', 1], ['F5', 'D4', 1], ['E5', 'D3', 1], ['D5', 'A3', 1],
  ['Cs5', 'A2', 1], ['A4', 'A3', 1], ['E5', 'A2', 1], ['A4', 'A3', 1],
  ['G5', 'A2', 1], ['F5', 'G3', 1], ['E5', 'F3', 1], ['D5', 'E3', 1],
  ['D5', 'D3', 2], ['_', 'D4', 1], ['A4', 'D3', 1],
  ['D5', 'D3', 1], ['F5', 'F3', 1], ['G5', 'G3', 1], ['A5', 'A3', 1],
  ['Bb5', 'Bb2', 1], ['A5', 'Bb3', 1], ['G5', 'Bb2', 1], ['F5', 'Bb3', 1],
  ['E5', 'A2', 1], ['Cs5', 'A3', 1], ['A4', 'E3', 1], ['_', 'A2', 1],
  // --- PARTE B (F -> C -> Gm -> A7 -> Dm) ---
  ['F5', 'F3', 2], ['_', 'C3', 1], ['C5', 'F3', 1],
  ['F5', 'F3', 1], ['A5', 'C3', 1], ['G5', 'F3', 1], ['F5', 'A3', 1],
  ['E5', 'C3', 1], ['C5', 'G3', 1], ['G5', 'C3', 1], ['C5', 'G3', 1],
  ['Bb5', 'C3', 1], ['A5', 'G3', 1], ['G5', 'E3', 1], ['E5', 'C3', 1],
  ['D5', 'D3', 1], ['E5', 'E3', 1], ['F5', 'F3', 1], ['G5', 'G3', 1],
  ['A5', 'G3', 1], ['Bb5', 'D3', 1], ['A5', 'G3', 1], ['G5', 'Bb2', 1],
  ['F5', 'A2', 1], ['E5', 'E3', 1], ['D5', 'A3', 1], ['Cs5', 'A2', 1],
  ['D5', 'D3', 3], ['_', 'A2', 1]
];

class ZXSoundSystem {
  constructor() {
    this.ctx = null;
    this.sfxEnabled = true;
    this.musicEnabled = true;
    this.noiseBuffer = null;
    this.musicStep = 0;
    this.nextNoteTime = 0;
    this.stepDuration = 0.11; // 150 BPM aprox
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.createNoiseBuffer();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  createNoiseBuffer() {
    const bufferSize = this.ctx.sampleRate * 1.0;
    this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = this.noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
  }

  beep(freq = 440, duration = 0.08, type = 'square', slide = 0, vol = 0.12) {
    if (!this.sfxEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (slide !== 0) {
        osc.frequency.linearRampToValueAtTime(Math.max(40, freq + slide), this.ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  noise(duration = 0.15, vol = 0.15) {
    if (!this.sfxEnabled || !this.ctx || !this.noiseBuffer) return;
    try {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
      src.connect(gain);
      gain.connect(this.ctx.destination);
      src.start();
      src.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  // Actualizador del secuenciador de música por pasos en bucle
  updateMusic() {
    if (!this.musicEnabled || !this.ctx) return;
    
    while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
      const currentNoteData = CHRONODECK_THEME[this.musicStep];
      const [melodyNote, bassNote, durationSteps] = currentNoteData;
      const noteDuration = durationSteps * this.stepDuration;

      // Canal Melodía (Onda cuadrada 8-bit)
      if (NOTE[melodyNote] > 0) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = NOTE[melodyNote];
        gain.gain.setValueAtTime(0.065, this.nextNoteTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.nextNoteTime + noteDuration * 0.9);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.nextNoteTime);
        osc.stop(this.nextNoteTime + noteDuration);
      }

      // Canal Bajo (Onda triángulo estilo SID/AY)
      if (NOTE[bassNote] > 0) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = NOTE[bassNote];
        gain.gain.setValueAtTime(0.08, this.nextNoteTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.nextNoteTime + noteDuration * 0.85);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.nextNoteTime);
        osc.stop(this.nextNoteTime + noteDuration);
      }

      this.nextNoteTime += noteDuration;
      this.musicStep = (this.musicStep + 1) % CHRONODECK_THEME.length;
    }
  }

  playLoadPulse(high) {
    this.beep(high ? 2100 : 1050, 0.025, 'square', 0, 0.05);
  }
  playJump() {
    this.beep(300, 0.14, 'square', 550, 0.12);
  }
  playCoin() {
    this.beep(987.77, 0.06, 'square', 0, 0.12);
    setTimeout(() => this.beep(1318.51, 0.15, 'square', 0, 0.12), 60);
  }
  playHit() {
    this.noise(0.2, 0.2);
    this.beep(140, 0.2, 'sawtooth', -80, 0.15);
  }
  playLaser() {
    this.beep(1400, 0.12, 'square', -1000, 0.12);
  }
  playChronoActivate() {
    const notes = [440, 554, 659, 880, 1108, 1318];
    notes.forEach((n, i) => {
      setTimeout(() => this.beep(n, 0.07, 'square', 0, 0.14), i * 45);
    });
  }
  playLevelWin() {
    const notes = [523, 659, 784, 1046, 784, 1046];
    notes.forEach((n, i) => {
      setTimeout(() => this.beep(n, 0.11, 'square', 0, 0.14), i * 100);
    });
  }
}

const sfx = new ZXSoundSystem();

// --- CONTROLES DE INTERFAZ Y TECLADO ---
const keys = {
  left: false,
  right: false,
  action: false,
  actionJustPressed: false
};

window.addEventListener('keydown', (e) => {
  sfx.init();
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
  if (['Space', 'KeyZ', 'Enter', 'ArrowUp', 'KeyW'].includes(e.code)) {
    if (!keys.action) keys.actionJustPressed = true;
    keys.action = true;
    e.preventDefault();
  }
});

window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
  if (['Space', 'KeyZ', 'Enter', 'ArrowUp', 'KeyW'].includes(e.code)) keys.action = false;
});

// Soporte táctil
function bindTouch(id, keyProp) {
  const el = document.getElementById(id);
  const start = (e) => {
    e.preventDefault();
    sfx.init();
    if (keyProp === 'action' && !keys.action) keys.actionJustPressed = true;
    keys[keyProp] = true;
  };
  const end = (e) => {
    e.preventDefault();
    keys[keyProp] = false;
  };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}
bindTouch('t-left', 'left');
bindTouch('t-right', 'right');
bindTouch('t-action', 'action');

// Botones UI
document.getElementById('btn-sound').addEventListener('click', (e) => {
  sfx.init();
  sfx.sfxEnabled = !sfx.sfxEnabled;
  e.target.textContent = `FX: ${sfx.sfxEnabled ? 'ON' : 'OFF'}`;
});
document.getElementById('btn-music').addEventListener('click', (e) => {
  sfx.init();
  sfx.musicEnabled = !sfx.musicEnabled;
  if (sfx.musicEnabled && sfx.ctx) {
    sfx.nextNoteTime = sfx.ctx.currentTime + 0.05;
  }
  e.target.textContent = `MÚSICA: ${sfx.musicEnabled ? 'ON' : 'OFF'}`;
});
document.getElementById('btn-crt').addEventListener('click', (e) => {
  const layer = document.getElementById('crt-layer');
  const active = layer.style.display !== 'none';
  layer.style.display = active ? 'none' : 'block';
  e.target.textContent = `CRT: ${active ? 'OFF' : 'ON'}`;
});

// --- SPRITES EN MATRICES DE PÍXELES ---
const SPRITES = {
  francesc: [
    "....YYYY....",
    "...YYYYYY...",
    "...WWBWWB...",
    "...WWWWWW...",
    "....WWWW....",
    "..CCCCCCCC..",
    ".CCCCCCCCCC.",
    ".CC.CCCC.CC.",
    ".WW.CCCC.WW.",
    "....YYYY....",
    "...BBBBBB...",
    "...BB..BB...",
    "...BB..BB...",
    "...BB..BB...",
    "..WW....WW..",
    "..WW....WW.."
  ],
  tape: [
    "YYYYYYYYYYYY",
    "YKKKKKKKKKKY",
    "YKWwKKKKwWKY",
    "YKWwKKKKwWKY",
    "YKKKKKKKKKKY",
    "YKKWWWWWWKKY",
    "YKKKKKKKKKKY",
    "YYYYYYYYYYYY"
  ],
  jsonld: [
    "..YYYY..",
    ".YBBBBY.",
    "YBWWWWBY",
    "YBWYYWBY",
    "YBWYYWBY",
    "YBWWWWBY",
    ".YBBBBY.",
    "..YYYY.."
  ],
  burocracia: [
    "..RRRRRRRR..",
    ".RWWWWWWWWR.",
    ".RWKKKKKKWR.",
    ".RWWWWWWWWR.",
    ".RWKKKKKKWR.",
    ".RWWWWWWWWR.",
    ".RWRRRRRRWR.",
    ".RWWWWWWWWR.",
    "..RRRRRRRR..",
    "...R....R...",
    "..RR....RR..",
    "............"
  ],
  z80bug: [
    ".M........M.",
    "..M..MM..M..",
    "..MMMMMMMM..",
    ".MMWMMMMWMM.",
    "MMMMMMMMMMMM",
    "M.MMMMMMMM.M",
    "M.M......M.M",
    "..M.M..M.M..",
    "............"
  ]
};

const CHAR_COLOR_MAP = {
  'K': PAL.BLACK,
  'B': PAL.B_BLUE,
  'R': PAL.B_RED,
  'M': PAL.B_MAGENTA,
  'G': PAL.B_GREEN,
  'C': PAL.B_CYAN,
  'Y': PAL.B_YELLOW,
  'W': PAL.B_WHITE,
  'w': PAL.WHITE
};

function drawSprite(spriteLines, x, y, scale = 1, flipX = false, overrideColor = null) {
  const rx = Math.floor(OFF_X + x);
  const ry = Math.floor(OFF_Y + y);
  for (let row = 0; row < spriteLines.length; row++) {
    const line = spriteLines[row];
    for (let col = 0; col < line.length; col++) {
      const ch = line[flipX ? (line.length - 1 - col) : col];
      if (ch !== '.') {
        ctx.fillStyle = overrideColor || CHAR_COLOR_MAP[ch] || PAL.B_WHITE;
        ctx.fillRect(rx + col * scale, ry + row * scale, scale, scale);
      }
    }
  }
}

function zxRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(OFF_X + x), Math.floor(OFF_Y + y), Math.floor(w), Math.floor(h));
}

function zxStrokeRect(x, y, w, h, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.floor(OFF_X + x) + 0.5, Math.floor(OFF_Y + y) + 0.5, Math.floor(w) - 1, Math.floor(h) - 1);
}

function zxText(text, x, y, color = PAL.B_WHITE, size = 8, align = 'left') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillText(text, Math.floor(OFF_X + x), Math.floor(OFF_Y + y));
}

function drawULABorder(mode = 'solid', color1 = PAL.BLACK, timer = 0) {
  if (mode === 'solid') {
    ctx.fillStyle = color1;
    ctx.fillRect(0, 0, FULL_W, FULL_H);
  } else if (mode === 'loading') {
    let y = 0;
    let toggle = Math.floor(timer * 45) % 2 === 0;
    while (y < FULL_H) {
      const stripeH = 6 + ((Math.floor(y * 0.3 + timer * 60) % 5) * 2);
      ctx.fillStyle = toggle ? PAL.RED : PAL.CYAN;
      ctx.fillRect(0, y, FULL_W, stripeH);
      y += stripeH;
      toggle = !toggle;
    }
  } else if (mode === 'data') {
    let y = 0;
    let toggle = Math.floor(timer * 80) % 2 === 0;
    while (y < FULL_H) {
      const stripeH = 3 + (Math.floor(y + timer * 120) % 4);
      ctx.fillStyle = toggle ? PAL.BLUE : PAL.YELLOW;
      ctx.fillRect(0, y, FULL_W, stripeH);
      y += stripeH;
      toggle = !toggle;
    }
  }
  ctx.fillStyle = PAL.BLACK;
  ctx.fillRect(OFF_X, OFF_Y, SCR_W, SCR_H);
}

// ============================================================================
// ESTADO GLOBAL DEL JUEGO Y FASES
// ============================================================================
const STATE = {
  TITLE: 0,
  INTRO_LEVEL: 1,
  LEVEL_1_AZIMUT: 2,
  LEVEL_2_NYQUIST: 3,
  LEVEL_3_BNE: 4,
  LEVEL_4_BOSS: 5,
  VICTORY: 6,
  GAMEOVER: 7
};

let game = {
  state: STATE.TITLE,
  currentLevel: 1,
  score: 0,
  lives: 3,
  timer: 0,
  borderMode: 'loading',
  borderColor: PAL.BLACK,
  introTimer: 0
};

// ============================================================================
// FASE 1: "LA CUEVA DEL AZIMUT"
// ============================================================================
let lvl1 = {
  playerPhase: 1.8,
  targetPhase: 0.0,
  syncTime: 0,
  requiredSync: 5.0,
  tapeTimeLeft: 25.0
};

function initLevel1() {
  lvl1.playerPhase = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.0);
  lvl1.targetPhase = 0;
  lvl1.syncTime = 0;
  lvl1.tapeTimeLeft = 25.0;
  game.borderMode = 'solid';
  game.borderColor = PAL.BLUE;
}

function updateLevel1(dt) {
  lvl1.tapeTimeLeft -= dt;
  if (lvl1.tapeTimeLeft <= 0) {
    loseLife("¡FRENADO DE CINTA FALLIDO! DESALINEACIÓN CRÍTICA.");
    return;
  }

  lvl1.targetPhase += Math.sin(game.timer * 1.7) * 0.65 * dt + Math.cos(game.timer * 3.1) * 0.35 * dt;

  const adjustSpeed = 2.4;
  if (keys.left)  lvl1.playerPhase -= adjustSpeed * dt;
  if (keys.right) lvl1.playerPhase += adjustSpeed * dt;

  const diff = Math.abs(lvl1.playerPhase - lvl1.targetPhase);
  const isSynced = diff < 0.26;

  if (isSynced) {
    lvl1.syncTime += dt;
    game.borderColor = PAL.GREEN;
    if (Math.floor(game.timer * 20) % 3 === 0) sfx.beep(1200 - diff * 600, 0.03, 'square', 0, 0.05);
  } else {
    lvl1.syncTime = Math.max(0, lvl1.syncTime - dt * 0.4);
    game.borderColor = diff < 0.6 ? PAL.YELLOW : PAL.RED;
    if (Math.floor(game.timer * 15) % 4 === 0) sfx.noise(0.03, 0.04);
  }

  if (lvl1.syncTime >= lvl1.requiredSync) {
    game.score += 1000 + Math.floor(lvl1.tapeTimeLeft * 50);
    sfx.playLevelWin();
    startLevelIntro(2);
  }
}

function drawLevel1() {
  zxRect(0, 0, SCR_W, 20, PAL.BLUE);
  zxText("FASE 1: LA CUEVA DEL AZIMUT", 6, 3, PAL.B_YELLOW, 9);
  zxText(`TINTA: ${lvl1.tapeTimeLeft.toFixed(1)}s`, 182, 3, PAL.B_WHITE, 9);
  zxText("AJUSTA TORNILLO DEL CABEZAL [IZQ / DER]", 6, 12, PAL.B_CYAN, 7);

  zxStrokeRect(10, 26, 156, 110, PAL.B_CYAN);
  zxRect(11, 27, 154, 108, PAL.BLACK);

  ctx.strokeStyle = '#003333';
  ctx.beginPath();
  for (let gx = 30; gx < 166; gx += 20) {
    ctx.moveTo(OFF_X + gx, OFF_Y + 27);
    ctx.lineTo(OFF_X + gx, OFF_Y + 135);
  }
  for (let gy = 45; gy < 135; gy += 20) {
    ctx.moveTo(OFF_X + 11, OFF_Y + gy);
    ctx.lineTo(OFF_X + 165, OFF_Y + gy);
  }
  ctx.stroke();

  const diff = Math.abs(lvl1.playerPhase - lvl1.targetPhase);
  const isSynced = diff < 0.26;

  for (let x = 0; x < 150; x++) {
    const t = (x / 20) + game.timer * 7;
    const yRef = 81 + Math.sin(t + lvl1.targetPhase) * 32;
    const yPlr = 81 + Math.sin(t + lvl1.playerPhase) * 32;

    zxRect(13 + x, yRef, 2, 2, PAL.B_RED);
    zxRect(13 + x, yPlr, 2, 2, isSynced ? PAL.B_GREEN : PAL.B_YELLOW);
  }

  zxStrokeRect(172, 26, 74, 74, PAL.B_MAGENTA);
  zxText("LISSAJOUS XY", 177, 29, PAL.B_MAGENTA, 7);
  const phaseDelta = lvl1.playerPhase - lvl1.targetPhase;
  for (let a = 0; a < Math.PI * 2; a += 0.08) {
    const lx = 209 + Math.sin(a) * 24;
    const ly = 66 + Math.sin(a + phaseDelta) * 24;
    zxRect(lx, ly, 2, 2, isSynced ? PAL.B_GREEN : PAL.B_CYAN);
  }

  zxStrokeRect(172, 104, 74, 32, PAL.WHITE);
  zxText("ENTREHIERRO:", 176, 107, PAL.B_WHITE, 7);
  const angle = lvl1.playerPhase * 1.5;
  const cx = OFF_X + 209;
  const cy = OFF_Y + 124;
  ctx.strokeStyle = PAL.B_YELLOW;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.moveTo(cx - Math.cos(angle) * 7, cy - Math.sin(angle) * 7);
  ctx.lineTo(cx + Math.cos(angle) * 7, cy + Math.sin(angle) * 7);
  ctx.stroke();

  zxText("ESTABILIDAD DE FASE (MANTENER 5 SEG):", 10, 144, PAL.B_WHITE, 8);
  zxStrokeRect(10, 155, 236, 14, PAL.B_WHITE);
  const fillW = Math.min(232, (lvl1.syncTime / lvl1.requiredSync) * 232);
  zxRect(12, 157, fillW, 10, isSynced ? PAL.B_GREEN : PAL.B_YELLOW);

  const statusMsg = isSynced
    ? ">> SEÑAL FSK EN FASE OPTIMA - CAPTURANDO FLUJO <<"
    : "!! ERROR DE AZIMUT: AJUSTA FASE CON FLECHAS !!";
  zxText(statusMsg, 128, 176, isSynced ? PAL.B_GREEN : PAL.B_RED, 8, 'center');
}

let lvl2 = {
  playerX: 112,
  playerW: 34,

function initLevel2() {
  lvl2.playerX = 112;
  lvl2.progress = 0;
  lvl2.items = [];
  lvl2.spawnTimer = 0;
  game.borderMode = 'data';
}

function updateLevel2(dt) {
  const speed = 155;
  if (keys.left)  lvl2.playerX = Math.max(4, lvl2.playerX - speed * dt);
  if (keys.right) lvl2.playerX = Math.min(SCR_W - lvl2.playerW - 4, lvl2.playerX + speed * dt);

  lvl2.spawnTimer -= dt;
  if (lvl2.spawnTimer <= 0) {
    const isGood = Math.random() < 0.62;
    const goodLabels = ["44.1kHz", "16-BIT", "PCM WAV", "NYQUIST"];
    const badLabels  = ["96kHz!!", "RUIDO", "DROPOUT", "ALIASING"];
    lvl2.items.push({
      x: 10 + Math.random() * (SCR_W - 48),
      y: 22,
      vy: 62 + Math.random() * 55 + (lvl2.progress * 0.4),
      good: isGood,
      label: isGood ? goodLabels[Math.floor(Math.random() * goodLabels.length)] : badLabels[Math.floor(Math.random() * badLabels.length)]
    });
    lvl2.spawnTimer = 0.42;
  }

  const py = 162;
  for (let i = lvl2.items.length - 1; i >= 0; i--) {
    const it = lvl2.items[i];
    it.y += it.vy * dt;

    if (it.y + 12 >= py && it.y <= py + 14 && it.x + 32 >= lvl2.playerX && it.x <= lvl2.playerX + lvl2.playerW) {
      if (it.good) {
        lvl2.progress = Math.min(100, lvl2.progress + 8);
        game.score += 150;
        sfx.playCoin();
      } else {
        lvl2.progress = Math.max(0, lvl2.progress - 12);
        sfx.playHit();
        loseLife("¡DESBORDAMIENTO DE BUFFER POR SOBREMUESTREO / RUIDO!");
        lvl2.items.splice(i, 1);
        return;
      }
      lvl2.items.splice(i, 1);
      continue;
    }

    if (it.y > SCR_H) {
      lvl2.items.splice(i, 1);
    }
  }

  if (lvl2.progress >= 100) {
    game.score += 1500;
    sfx.playLevelWin();
    startLevelIntro(3);
  }
}

function initLevel3() {

    { x: 124, y: 90,  taken: false, name: "SKOS" },

  ];

  lvl3.enemies = [
    { x: 110, y: 162, minX: 70,  maxX: 220, vx: 48,  type: 'burocracia' },
    { x: 90,  y: 92,  minX: 76,  maxX: 165, vx: -55, type: 'z80bug' },
    { x: 20,  y: 56,  minX: 12,  maxX: 76,  vx: 42,  type: 'burocracia' },
    { x: 180, y: 56,  minX: 168, maxX: 230, vx: -45, type: 'z80bug' }
  ];
}

function updateLevel3(dt) {
  const moveSpeed = 95;
  const gravity = 390;
  const jumpForce = -182;

  if (keys.left) {
    lvl3.vx = -moveSpeed;
    lvl3.facingLeft = true;
  } else if (keys.right) {
    lvl3.vx = moveSpeed;
    lvl3.facingLeft = false;
  } else {
    lvl3.vx = 0;
  }

  if (keys.actionJustPressed && lvl3.onGround) {
    lvl3.vy = jumpForce;
    lvl3.onGround = false;
    sfx.playJump();
  }

  const prevY = lvl3.py;
  lvl3.px += lvl3.vx * dt;
  lvl3.py += lvl3.vy * dt;
  lvl3.vy += gravity * dt;

  lvl3.px = Math.max(2, Math.min(SCR_W - 14, lvl3.px));

  lvl3.onGround = false;
  for (const p of lvl3.platforms) {
    if (
      lvl3.vy >= 0 &&
      lvl3.px + 10 > p.x &&
      lvl3.px + 2 < p.x + p.w &&
      prevY + 16 <= p.y + 4 &&
      lvl3.py + 16 >= p.y
    ) {
      lvl3.py = p.y - 16;
      lvl3.vy = 0;
      lvl3.onGround = true;
    }
  }

  for (const t of lvl3.tokens) {
    if (!t.taken) {
      if (
        lvl3.px + 12 > t.x &&
        lvl3.px < t.x + 10 &&
        lvl3.py + 16 > t.y &&
        lvl3.py < t.y + 10
      ) {
        t.taken = true;
        lvl3.collected++;
        game.score += 300;
        sfx.playCoin();
      }
    }
  }

  for (const en of lvl3.enemies) {
    en.x += en.vx * dt;
    if (en.x < en.minX) { en.x = en.minX; en.vx *= -1; }
    if (en.x > en.maxX) { en.x = en.maxX; en.vx *= -1; }

    if (
      lvl3.px + 10 > en.x + 2 &&
      lvl3.px + 2 < en.x + 10 &&
      lvl3.py + 15 > en.y + 2 &&
      lvl3.py + 2 < en.y + 11
    ) {
      sfx.playHit();
      loseLife("¡BLOQUEADO POR TRÁMITE DE OBRA HUÉRFANA / REGISTRO Z80!");
      return;
    }
  }

  if (lvl3.collected >= lvl3.totalTokens) {
    game.score += 2000;
    sfx.playLevelWin();
    startLevelIntro(4);
  }
}

function drawLevel3() {
  zxRect(0, 0, SCR_W, 16, PAL.BLUE);
  zxText("FASE 3: PASILLOS DE LA BNE", 4, 4, PAL.B_YELLOW, 8);
  zxText(`METADATOS: ${lvl3.collected}/${lvl3.totalTokens}`, 168, 4, PAL.B_CYAN, 8);

  for (let sx = 18; sx < 240; sx += 48) {
    zxStrokeRect(sx, 22, 24, 150, '#001844');
  }

  for (const p of lvl3.platforms) {
    zxRect(p.x, p.y, p.w, p.h, PAL.CYAN);
    for (let bx = p.x; bx < p.x + p.w; bx += 8) {
      zxRect(bx, p.y, 4, 2, PAL.B_WHITE);
    }
  }

  const blink = Math.floor(game.timer * 8) % 2 === 0;
  for (const t of lvl3.tokens) {
    if (!t.taken) {
      drawSprite(SPRITES.jsonld, t.x, t.y, 1, false, blink ? PAL.B_YELLOW : PAL.B_CYAN);
      zxText(t.name, t.x + 4, t.y - 7, PAL.B_WHITE, 6, 'center');
    }
  }

  for (const en of lvl3.enemies) {
    const spr = en.type === 'burocracia' ? SPRITES.burocracia : SPRITES.z80bug;
    drawSprite(spr, en.x, en.y, 1, en.vx < 0);
  }

  drawSprite(SPRITES.francesc, lvl3.px, lvl3.py, 1, lvl3.facingLeft);
}

  game.borderMode = 'solid';

  lvl4.px = 120;
  lvl4.bossX = 100;
  lvl4.bossY = 38;
  lvl4.bossVx = 105;
  lvl4.bossHP = 100;
  lvl4.chronoEnergy = 40;
  lvl4.chronoActive = false;
  lvl4.chronoTimer = 0;
  lvl4.bullets = [];
  lvl4.playerLasers = [];
  lvl4.shootCooldown = 0;
}

function updateLevel4(dt) {
  const pSpeed = 125;
  if (keys.left)  lvl4.px = Math.max(8, lvl4.px - pSpeed * dt);
  if (keys.right) lvl4.px = Math.min(SCR_W - 22, lvl4.px + pSpeed * dt);

  lvl4.shootCooldown -= dt;

  if (!lvl4.chronoActive) {
    lvl4.chronoEnergy = Math.min(100, lvl4.chronoEnergy + 22 * dt);
    lvl4.cpuFreq = 3.8 + Math.random() * 1.9;
    game.borderColor = PAL.BLACK;
  } else {
    lvl4.chronoTimer -= dt;
    lvl4.cpuFreq = 3.546900;
    game.borderColor = PAL.CYAN;
    if (lvl4.chronoTimer <= 0) {
      lvl4.chronoActive = false;
    }
  }

  if (keys.actionJustPressed) {
    if (!lvl4.chronoActive && lvl4.chronoEnergy >= 100) {
      lvl4.chronoActive = true;
      lvl4.chronoTimer = 4.5;
      lvl4.chronoEnergy = 0;
      sfx.playChronoActivate();
    } else if (lvl4.shootCooldown <= 0) {
      lvl4.playerLasers.push({ x: lvl4.px + 5, y: 152 });
      lvl4.shootCooldown = 0.22;
      sfx.playLaser();
    }
  }

  const timeScale = lvl4.chronoActive ? 0.08 : 1.0;
  lvl4.bossX += lvl4.bossVx * dt * timeScale;
  if (lvl4.bossX < 16) { lvl4.bossX = 16; lvl4.bossVx *= -1; }
  if (lvl4.bossX > SCR_W - 64) { lvl4.bossX = SCR_W - 64; lvl4.bossVx *= -1; }

  if (!lvl4.chronoActive && Math.random() < 0.065) {
    lvl4.bullets.push({
      x: lvl4.bossX + 24 + (Math.random() * 20 - 10),
      y: lvl4.bossY + 34,
      vy: 95 + Math.random() * 55
    });
    sfx.noise(0.05, 0.06);
  }

  for (let i = lvl4.bullets.length - 1; i >= 0; i--) {
    const b = lvl4.bullets[i];
    b.y += b.vy * dt * timeScale;

    if (b.y + 6 >= 156 && b.y <= 172 && b.x + 5 >= lvl4.px && b.x <= lvl4.px + 12) {
      sfx.playHit();
      loseLife("¡IMPACTO DE CORRUPCIÓN MAGNÉTICA BIT ROT!");
      return;
    }
    if (b.y > SCR_H) lvl4.bullets.splice(i, 1);
  }

  for (let i = lvl4.playerLasers.length - 1; i >= 0; i--) {
    const l = lvl4.playerLasers[i];
    l.y -= 240 * dt;

    if (
      l.x >= lvl4.bossX &&
      l.x <= lvl4.bossX + 48 &&
      l.y >= lvl4.bossY &&
      l.y <= lvl4.bossY + 32
    ) {
      if (lvl4.chronoActive) {
        lvl4.bossHP = Math.max(0, lvl4.bossHP - 9);
        game.score += 200;
        sfx.playCoin();
      } else {
        lvl4.bossHP = Math.max(0, lvl4.bossHP - 1);
        sfx.beep(180, 0.04, 'square', 0, 0.08);
      }
      lvl4.playerLasers.splice(i, 1);
      continue;
    }

    if (l.y < 20) lvl4.playerLasers.splice(i, 1);
  }

  if (lvl4.bossHP <= 0) {
    game.score += 5000;
    sfx.playLevelWin();
    game.state = STATE.VICTORY;
    game.borderMode = 'loading';
  }
}

function startLevelIntro(lvlNum) {
  game.currentLevel = lvlNum;
  game.state = STATE.INTRO_LEVEL;
  game.introTimer = 2.6;
  game.borderMode = 'data';
}

function loseLife(reason) {
  game.lives--;
  game.lastDeathReason = reason;
  if (game.lives <= 0) {
    game.state = STATE.GAMEOVER;
    game.borderMode = 'solid';
    game.borderColor = PAL.RED;
  } else {
    startLevelIntro(game.currentLevel);
  }
}

function resetFullGame() {
  game.score = 0;
  game.lives = 3;
  startLevelIntro(1);
}

  if (Math.floor(game.timer * 30) % 4 === 0) {
    sfx.playLoadPulse(Math.random() > 0.5);

  zxText("Program: CHRONODECK.TZX", 14, 11, PAL.B_WHITE, 8);

function drawGameOverScreen() {
  zxStrokeRect(16, 36, 224, 120, PAL.B_RED);

    zxText(game.lastDeathReason.substring(0, 38), 128, 92, PAL.B_YELLOW, 6, 'center');
  }
  zxText(`PUNTUACION FINAL: ${game.score}`, 128, 112, PAL.B_CYAN, 8, 'center');

  }
}

// ============================================================================
// BUCLE PRINCIPAL DEL JUEGO
// ============================================================================
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  game.timer += dt;

  // Actualizar secuenciador musical de 8 bits
  sfx.updateMusic();

  drawULABorder(game.borderMode, game.borderColor, game.timer);

  switch (game.state) {
    case STATE.TITLE:
      drawTitleScreen();
      if (keys.actionJustPressed) {
        sfx.playCoin();
        resetFullGame();
      }
      break;

    case STATE.INTRO_LEVEL:
      drawLevelIntro();
      game.introTimer -= dt;
      if (Math.floor(game.timer * 25) % 3 === 0) sfx.playLoadPulse(true);
      if (game.introTimer <= 0 || keys.actionJustPressed) {
        if (game.currentLevel === 1) { initLevel1(); game.state = STATE.LEVEL_1_AZIMUT; }
        if (game.currentLevel === 2) { initLevel2(); game.state = STATE.LEVEL_2_NYQUIST; }
        if (game.currentLevel === 3) { initLevel3(); game.state = STATE.LEVEL_3_BNE; }
        if (game.currentLevel === 4) { initLevel4(); game.state = STATE.LEVEL_4_BOSS; }
      }
      break;

    case STATE.LEVEL_1_AZIMUT:
      updateLevel1(dt);
      drawLevel1();
      break;

    case STATE.LEVEL_2_NYQUIST:
      updateLevel2(dt);
      drawLevel2();
      break;

    case STATE.LEVEL_3_BNE:
      updateLevel3(dt);
      drawLevel3();
      break;

    case STATE.LEVEL_4_BOSS:
      updateLevel4(dt);
      drawLevel4();
      break;

    case STATE.VICTORY:
      drawVictoryScreen();
      if (keys.actionJustPressed) {
        sfx.playCoin();
        game.state = STATE.TITLE;
      }
      break;

    case STATE.GAMEOVER:
      drawGameOverScreen();
      if (keys.actionJustPressed) {
        sfx.playCoin();
        game.state = STATE.TITLE;
        game.borderMode = 'loading';
      }
      break;
  }

  keys.actionJustPressed = false;
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
